<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Story 🌹</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0510 0%, #3d0a1e 40%, #1a0510 100%);
      overflow: hidden;
    }
    .lock-box {
      text-align: center;
      padding: 3rem 2.5rem;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .lock-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 1.2rem;
      animation: heartBeat 1.5s ease-in-out infinite;
    }
    .lock-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.5rem;
      color: #f9d0d9;
      margin-bottom: 0.4rem;
    }
    .lock-sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      color: rgba(249,208,217,0.6);
      font-size: 1rem;
      margin-bottom: 2rem;
      letter-spacing: 1px;
    }
    .lock-input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      border-radius: 50px;
      border: 1px solid rgba(232,99,122,0.4);
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 8px;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: border 0.3s, box-shadow 0.3s;
      margin-bottom: 1rem;
    }
    .lock-input::placeholder {
      letter-spacing: 4px;
      font-size: 1rem;
      color: rgba(255,255,255,0.3);
    }
    .lock-input:focus {
      border-color: rgba(232,99,122,0.8);
      box-shadow: 0 0 20px rgba(232,99,122,0.2);
    }
    .lock-btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #e8637a, #c0395a);
      color: white;
      font-family: 'Lato', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 10px 30px rgba(200,60,80,0.35);
    }
    .lock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(200,60,80,0.5);
    }
    .lock-error {
      color: #f9d0d9;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .lock-error.show { opacity: 1; }
    .shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
  </style>
</head>
<body>

<div class="hearts-layer"></div>

<div class="lock-box" id="lock-box">
  <span class="lock-icon">🌹</span>
  <h1 class="lock-title">Our Story</h1>
  <p class="lock-sub">enter the secret to unlock</p>

  <input
    class="lock-input"
    id="password-input"
    type="password"
    placeholder="• • • •"
    maxlength="10"
    autocomplete="off"
  />

  <button class="lock-btn" onclick="checkPassword()">Open ❤️</button>

  <p class="lock-error" id="lock-error">Wrong password, try again 💔</p>
</div>

<script src="js/main.js"></script>
<script>
  // If already unlocked, go straight to index
  if (sessionStorage.getItem('unlocked') === 'yes') {
    window.location.href = 'index.html';
  }

  function checkPassword() {
    const val = document.getElementById('password-input').value;
    if (val === '1207') {
      sessionStorage.setItem('unlocked', 'yes');
      // Transition effect
      document.body.style.transition = 'opacity 0.6s ease';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = 'index.html'; }, 600);
    } else {
      const box = document.getElementById('lock-box');
      const err = document.getElementById('lock-error');
      err.classList.add('show');
      box.classList.add('shake');
      setTimeout(() => box.classList.remove('shake'), 400);
      document.getElementById('password-input').value = '';
    }
  }

  // Enter key support
  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });
</script>
</body>
</html>
